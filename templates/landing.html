<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RED Panel — License System</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="landing-body">

  <div class="landing-container">

    <div class="landing-header">
      <div class="logo-badge">RED</div>
      <h1>RED License Panel</h1>
      <p class="subtitle">Sistem manajemen license dengan reseller & balance</p>
    </div>

    <div class="landing-cards">

      <a href="/login" class="landing-card">
        <div class="landing-card-icon">🔑</div>
        <h3>Login</h3>
        <p>Masuk sebagai admin atau reseller</p>
      </a>

      <a href="/register" class="landing-card">
        <div class="landing-card-icon">📝</div>
        <h3>Daftar Reseller</h3>
        <p>Buat akun reseller baru (perlu approve admin)</p>
      </a>

      <a href="/activate" class="landing-card">
        <div class="landing-card-icon">✓</div>
        <h3>Aktivasi Key</h3>
        <p>Aktivasi license key kamu di sini</p>
      </a>

    </div>

    <div class="landing-footer">
      <p>© 2026 RED Panel — License Management System</p>
    </div>

  </div>

</body>
</html>
